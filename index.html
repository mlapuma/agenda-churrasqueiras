<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Agenda da Churrasqueira - Fora do ar</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: Arial, Helvetica, sans-serif;
      background: linear-gradient(135deg, #f6f7f9, #e9edf2);
      color: #1f2937;
    }
    .offline-card {
      width: min(100%, 620px);
      background: #fff;
      border-radius: 22px;
      padding: 44px 34px;
      text-align: center;
      box-shadow: 0 20px 55px rgba(17, 24, 39, .12);
      border: 1px solid #e5e7eb;
    }
    .icon {
      width: 82px;
      height: 82px;
      margin: 0 auto 22px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: #fef2f2;
      font-size: 42px;
    }
    .eyebrow {
      margin: 0 0 10px;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: .14em;
      text-transform: uppercase;
      color: #6b7280;
    }
    h1 {
      margin: 0 0 16px;
      font-size: clamp(30px, 7vw, 44px);
      line-height: 1.05;
      color: #111827;
    }
    .message {
      margin: 0 auto;
      max-width: 480px;
      font-size: 18px;
      line-height: 1.6;
      color: #4b5563;
    }
    .status {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-top: 28px;
      padding: 10px 16px;
      border-radius: 999px;
      background: #f3f4f6;
      color: #374151;
      font-size: 14px;
      font-weight: 700;
    }
    .dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #dc2626;
    }
    footer {
      margin-top: 30px;
      font-size: 13px;
      color: #9ca3af;
    }
    @media (max-width: 520px) {
      .offline-card { padding: 36px 22px; border-radius: 18px; }
      .message { font-size: 16px; }
    }
  </style>
</head>
<body>
  <main class="offline-card" role="main" aria-labelledby="titulo">
    <div class="icon" aria-hidden="true">🔥</div>
    <p class="eyebrow">Condomínio Terra Branca</p>
    <h1 id="titulo">Agenda temporariamente fora do ar</h1>
    <p class="message">
      O sistema de agendamento da churrasqueira está indisponível no momento.
      Para novos agendamentos, utilize temporariamente o procedimento definido pelo condomínio.
    </p>
    <div class="status" aria-label="Sistema indisponível">
      <span class="dot" aria-hidden="true"></span>
      Sistema indisponível
    </div>
    <footer>Agenda da Churrasqueira • Condomínio Terra Branca</footer>
  </main>
</body>
</html>
